name = "inventaire"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

# ---- D1: the database of record (design §5.1) --------------------------
[[d1_databases]]
binding       = "DB"
database_name = "inventaire"
database_id   = "6ba0cb6b-6152-47c4-9e93-803d42a543c1"

# ---- R2: photos --------------------------------------------------------
[[r2_buckets]]
binding     = "PHOTOS"
bucket_name = "inventaire-photos"

# ---- Queue: AI jobs ----------------------------------------------------
# Free plan retains messages for 24h only, so the DB is the truth and a
# daily sweep re-queues anything stranded (design §5.1, data model §3.3).
[[queues.producers]]
binding = "JOBS"
queue   = "inventaire-jobs"

[[queues.consumers]]
queue               = "inventaire-jobs"
max_batch_size      = 1
max_batch_timeout   = 5
max_retries         = 3
max_concurrency     = 2

# Daily sweep for stranded jobs
[triggers]
crons = ["0 3 * * *"]

[vars]
SCHEMA_VERSION = "1"

# Secrets are NOT here. Set with:
#   npx wrangler secret put LONGCAT_API_KEY
# or in the dashboard under Settings → Variables → Encrypt.
