name = "inventaire"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

# ---- D1: the database of record (design §5.1) --------------------------
[[d1_databases]]
binding       = "DB"
database_name = "inventaire"
database_id   = "6ba0cb6b-6152-47c4-9e93-803d42a543c1"

# ---- R2: photos --------------------------------------------------------
[[r2_buckets]]
binding      = "PHOTOS"
bucket_name  = "inventaire-photos"
jurisdiction = "eu"          # hard EU data-residency boundary, not just a hint.
                             # CLI commands need --jurisdiction eu or they 404.

# ---- Workers AI: PDF -> text only --------------------------------------
# toMarkdown runs the conversion OFF the Worker. That is the whole point:
# parsing a 160-page manual in-process would blow through the 10 ms CPU
# budget of the free plan. No text generation happens here — that is LongCat.
[ai]
binding = "AI"

# ---- Queue: AI jobs ----------------------------------------------------
# Free plan retains messages for 24h only, so the DB is the truth and a
# daily sweep re-queues anything stranded (design §5.1, data model §3.3).
[[queues.producers]]
binding = "JOBS"
queue   = "inventaire-jobs"

[[queues.consumers]]
queue               = "inventaire-jobs"
max_batch_size      = 1
max_batch_timeout   = 5
max_retries         = 3
max_concurrency     = 2   # Gemini free tier is ~10 requests/min per model; 429s back off 120 s

# Daily sweep for stranded jobs
[triggers]
crons = ["0 3 * * *"]

[vars]
SCHEMA_VERSION = "1"
# The LLM is configuration. LongCat was retired mid-project (Sep 2026) and
# the swap to Gemini's OpenAI-compatible endpoint was these lines plus one
# secret. Keep it that way. Free tier: ~10 RPM / 1 500 RPD per model, and
# Google may train on free-tier prompts (D68) — manual text only, no photos.
LLM_BASE_URL        = "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
LLM_MODEL_WRITE     = "gemini-3.5-flash-lite"   # 3.5 Flash is 20 req/DAY on this project; Lite is 500
LLM_MODEL_TRANSLATE = "gemini-3.5-flash-lite"   # candidates: gemma-4-31b-it (14 400/day) once probed

# Secrets are WORKER SECRETS, not in this repo and not in CI:
#   npx wrangler secret put LLM_API_KEY       (Gemini key: aistudio.google.com -> Get API key)
#   npx wrangler secret put SERPER_API_KEY
# (Secrets Store was tried first — nicer hygiene, but its binding refused
#  authorization at deploy despite correct token permission and workers
#  scope. A known upstream issue. One key, one consumer: not worth the fight.)
